[project]
name = "ruleshift"
version = "0.1.0"
description = "Reproducible worlds for studying agent memory under changing rules"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3", "gymnasium>=1,<2", "pyyaml>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.26,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
ruleshift = "ruleshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

